{% if user.is_authenticated %}

    <p>Welcome, {{ user.first_name|default:user.username }}!</p>

    {% if user.is_superuser %}
        <a href="{% url 'admin:index' %}" class="button">
            Go to Admin Panel
        </a>

    {% elif user.role == 'LIBRARIAN' %}
        <a href="{% url 'accounts:librarian_dashboard' %}" class="button">
            Go to Librarian Dashboard
        </a>

    {% else %}
        <a href="{% url 'accounts:member_dashboard' %}" class="button">
            Go to Dashboard
        </a>
    {% endif %}

{% else %}

    <a href="{% url 'accounts:login' %}" class="button">
        Login
    </a>

    <a href="{% url 'accounts:register' %}" class="button">
        Register
    </a>

{% endif %}
